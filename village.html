<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kishaan's Village</title>
    <meta
      name="description"
      content="Kishaan Gidda's portfolio as a tiny pixel-art RPG village. Walk into the buildings to explore his work."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0a0c'/%3E%3Ctext x='32' y='45' font-family='-apple-system,Segoe UI,sans-serif' font-size='38' font-weight='700' fill='%23f5f5f7' text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="village.css" />
  </head>
  <body>
    <!-- Drifting CSS clouds behind/around the island -->
    <div class="sky-clouds" aria-hidden="true">
      <span class="puff p1"></span>
      <span class="puff p2"></span>
      <span class="puff p3"></span>
      <span class="puff p4"></span>
    </div>

    <div class="stage" id="stage">
      <canvas id="village" width="480" height="320"></canvas>

      <!-- Hover tooltip (JRPG nameplate) -->
      <div class="tooltip" id="tooltip" aria-hidden="true"></div>

      <!-- "press space" nudge that floats above the player in a doorway -->
      <div class="interact-prompt" id="interactPrompt" aria-hidden="true">PRESS SPACE</div>
    </div>

    <!-- Cloud-level vignette / edge blur -->
    <div class="vignette" aria-hidden="true"></div>

    <!-- HUD -->
    <header class="hud hud-title pixel-window">
      <h1>KISHAAN'S VILLAGE</h1>
      <p>portfolio overworld</p>
    </header>

    <a class="hud hud-exit pixel-window" href="index.html">&larr; CLASSIC SITE</a>

    <p class="hud hud-hint" id="hint">WASD / ARROWS TO WALK &middot; STEP INSIDE &amp; PRESS SPACE</p>

    <!-- On-screen D-pad (touch devices only) -->
    <div class="dpad" id="dpad" aria-hidden="true">
      <button class="dpad-btn dpad-up pixel-window" data-dir="up" aria-label="Move up">&#9650;</button>
      <button class="dpad-btn dpad-left pixel-window" data-dir="left" aria-label="Move left">&#9664;</button>
      <button class="dpad-btn dpad-right pixel-window" data-dir="right" aria-label="Move right">&#9654;</button>
      <button class="dpad-btn dpad-down pixel-window" data-dir="down" aria-label="Move down">&#9660;</button>
    </div>

    <!-- JRPG dialogue box -->
    <div class="dialogue" id="dialogue" role="dialog" aria-modal="true" aria-hidden="true">
      <div class="dialogue-box pixel-window">
        <span class="nameplate" id="dlgName"></span>
        <p class="dlg-text" id="dlgText"></p>
        <div class="dlg-links" id="dlgLinks"></div>
        <span class="dlg-cue" id="dlgCue">&#9660;</span>
        <button class="dlg-close" id="dlgClose" aria-label="Close dialogue">&times;</button>
      </div>
    </div>

    <!-- Cell tower SMS popup -->
    <div class="sms" id="sms" role="dialog" aria-modal="true" aria-hidden="true">
      <div class="sms-screen">
        <div class="sms-status">
          <span class="sms-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span>SIGNAL: STRONG</span>
          <button class="sms-close" id="smsClose" aria-label="Close message">&times;</button>
        </div>
        <p class="sms-from">&gt; INCOMING TRANSMISSION_</p>
        <p class="sms-body" id="smsBody"></p>
        <div class="sms-actions">
          <a class="sms-btn" href="mailto:kishaangidda@gmail.com">&#9993; SEND EMAIL</a>
          <a class="sms-btn" href="https://github.com/kishaang" target="_blank" rel="noreferrer">GITHUB</a>
          <a class="sms-btn" href="https://www.linkedin.com/in/kishaan-gidda/" target="_blank" rel="noreferrer">LINKEDIN</a>
        </div>
      </div>
    </div>

    <script src="village-data.js"></script>
    <script src="village.js"></script>
  </body>
</html>
